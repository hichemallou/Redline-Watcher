[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clawwatch-demo"
version = "0.1.0"
description = "Local SIEM log replay and monitoring demo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "gradio==6.29.1",
    "huggingface-hub==2.1.1",
    "pandas==3.0.6",
]

[project.optional-dependencies]
dev = [
    "pip-tools==7.6.1",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[project.scripts]
clawwatch-demo = "clawwatch_demo.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"clawwatch_demo.migrations" = ["*.sql"]
"clawwatch_demo.ui.assets" = ["*.css"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
